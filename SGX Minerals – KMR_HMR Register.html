<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='sgx_kmrhmr_v1';
const ISO=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ISO(new Date());
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ISO(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pf=v=>{if(v==null||String(v).trim()==='')return null;const n=parseFloat(v);return isNaN(n)?null:n};

const cls=s=>String(s).replace(/ /g,'-'),role=()=>$('#role').value,canEdit=()=>role()!=='Operator';
let DB,DD=today(),editMode=null,PG='dash',F={};
function mk(id,reg,name,type,k,h){return{id,reg,name,type,k,h,lsK:null,lsH:null,kI:null,hI:null,lsD:'',act:true,maint:false,plan:''}}
function seed(){const L=[];for(let i=1;i<=12;i++){const n=String(i).padStart(2,'0');L.push(mk('TIP-'+n,i==1?'AP39UQ0095':'','Tipper '+n,'Tipper',1,1))}
for(let i=1;i<=2;i++)L.push(mk('LDR-0'+i,'','Loader 0'+i,'Loader',0,1));for(let i=1;i<=2;i++)L.push(mk('EXC-0'+i,'','Excavator 0'+i,'Excavator',0,1));
L.push(mk('DG-01','','DG Set 01','DG Set',0,1),mk('BOL-01','','Bolero/Camper','Bolero/Camper',1,0),mk('SCO-01','','Scorpio 01','Scorpio',1,0),mk('SCO-02','','Scorpio 02','Scorpio',1,0));
return{eq:L,entries:[],svc:[],audit:[],set:{sk:500,sh:25}}}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB||!DB.eq)DB=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function aud(a,dt){DB.audit.unshift({t:new Date().toLocaleString(),u:$('#usr').value||'user',r:role(),a,dt});DB.audit.length=Math.min(DB.audit.length,500)}
const EQ=id=>DB.eq.find(e=>e.id===id),E=(id,d)=>DB.entries.find(x=>x.eid===id&&x.date===d),act=()=>DB.eq.filter(e=>e.act);
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)}
function dlg(title,body,btns){$('#bx').innerHTML='<h3 style="margin-top:0">'+title+'</h3><div>'+body+'</div><div class="ft"></div>';const ft=$('#bx .ft');
btns.forEach(b=>{const x=document.createElement('button');x.textContent=b.t;if(b.c)x.className=b.c;x.onclick=async()=>{if(b.fn&&(await b.fn())===false)return;$('#ov').style.display='none'};ft.appendChild(x)});$('#ov').style.display='flex'}
const ask=m=>new Promise(r=>dlg('Confirm',m,[{t:'Cancel',fn:()=>r(false)},{t:'Continue',c:'p',fn:()=>r(true)}]));
const info=(t,m)=>dlg(t,m,[{t:'OK',c:'p'}]);
async function dl(name,data){try{const m=window.claude&&await window.claude.use('downloads');if(m){await m.save({filename:name,data});toast('Saved '+name);return}}catch(e){if(e&&/declin|cancel|reject/i.test(e.code+e.message))return}
dlg(esc(name),'<p class="mu">Direct download is unavailable here. Copy the text below into a file named <b>'+esc(name)+'</b>.</p><textarea class="big" readonly id="cp">'+esc(data)+'</textarea>',[{t:'Select all',fn:()=>{$('#cp').select();return false}},{t:'Close',c:'p'}])}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
/* ---- core readings logic ---- */
function prev(eid,d,f){let b=null;DB.entries.forEach(x=>{if(x.eid===eid&&x.date<d&&x.st!=='Draft'&&x['c'+f]!=null&&(!b||x.date>b.d))b={v:x['c'+f],d:x.date}});return b}
function nextE(eid,d,f){let b=null;DB.entries.forEach(x=>{if(x.eid===eid&&x.date>d&&x.st!=='Draft'&&x['c'+f]!=null&&(!b||x.date<b.date))b=x});return b}
function opv(eid,d,f,tr,rs){if(rs)return 0;const p=prev(eid,d,f);if(p)return p.v;const m=tr&&tr.querySelector('.m'+f);if(m)return pf(m.value);const x=E(eid,d);return x?x['o'+f]:null}
function rowCalc(e,d,x){const r={};['k','h'].forEach(f=>{if(!e[f]){r['o'+f]=r['c'+f]=r['d'+f]=null;return}const p=prev(e.id,d,f);const o=x&&x.rs?0:(p?p.v:(x?x['o'+f]:null)),c=x?x['c'+f]:null;r['o'+f]=o;r['c'+f]=c;r['d'+f]=(c!=null&&o!=null)?rd(c-o):null;r['g'+f]=p&&p.d!==addD(d,-1)?p.d:null});return r}
function cur(e,f){let b=null;DB.entries.forEach(x=>{if(x.eid===e.id&&x.st!=='Draft'&&x['c'+f]!=null&&(!b||x.date>b.date))b=x});return b?b['c'+f]:null}
const RANK={Overdue:4,Due:3,'Due Soon':2,Upcoming:1};
function svc(e){const o={e,dims:{}};let w=0,any=false;['k','h'].forEach(f=>{const I=f=='k'?e.kI:e.hI,L=f=='k'?e.lsK:e.lsH,c=cur(e,f);const d={cur:c,I,L};
if(e[f]&&I>0&&L!=null){any=true;d.next=L+I;d.rem=c==null?null:rd(d.next-c);const th=f=='k'?DB.set.sk:DB.set.sh;d.s=c==null?'No reading':d.rem<0?'Overdue':d.rem==0?'Due':d.rem<=th?'Due Soon':'Upcoming';w=Math.max(w,RANK[d.s]||0)}o.dims[f]=d});
o.s=e.maint?'Under Maintenance':!any?'Not Configured':(w==1&&e.lsD===today())?'Completed':w?Object.keys(RANK).find(k=>RANK[k]==w):'No reading';return o}
/* ---- pages ---- */
const PAGES=[['dash','Dashboard'],['daily','Daily KMR/HMR Entry'],['rep','KMR/HMR Reports'],['svc','Service Schedule'],['hist','Maintenance History'],['master','Equipment Master'],['data','Data & Audit']];
function go(p,flt){PG=p;if(flt!==undefined)F[p]=flt;if(p=='rep'&&flt=='today'){F.rf=F.rt=today()}$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));({dash:rDash,daily:rDaily,rep:rRep,svc:rSvc,hist:rHist,master:rMaster,data:rData})[p]();window.scrollTo(0,0)}
$('#nav').innerHTML=PAGES.map(p=>`<button data-p="${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');
const mn=h=>$('#main').innerHTML=h;
function rDash(){const t=today(),R=repData(t,t,'','','');const done=R.filter(r=>/Submitted|Corrected/.test(r.s)).length,pend=R.filter(r=>/Pending|Draft/.test(r.s)).length;
const S=act().map(svc),n=s=>S.filter(x=>x.s==s).length;let tk=0,th=0;R.forEach(r=>{if(/Submitted|Corrected/.test(r.s)){tk+=r.dk||0;th+=r.dh||0}});
const C=[['Total Active Equipment',act().length,'master','Active'],["Today's Completed Entries",done,'daily','Completed'],["Today's Pending Entries",pend,'daily','Pending'],["Total Daily KMR (today)",f1(tk),'rep','today'],["Total Daily HMR (today)",f1(th),'rep','today'],['Due for Service',n('Due')+n('Due Soon'),'svc','Due*'],['Overdue',n('Overdue'),'svc','Overdue'],['Under Maintenance',n('Under Maintenance'),'svc','Under Maintenance']];
F.daily=F.daily;DD=t;mn('<h2>Dashboard – '+t+'</h2><div class="cards">'+C.map(c=>`<div class="card" onclick="go('${c[2]}','${c[3]}')"><b>${c[1]}</b><span>${c[0]} ›</span></div>`).join('')+'</div><p class="mu">KMR and HMR are never added together. “Due for Service” = Due + Due Soon. Click a card to open the filtered table. Data is stored in this browser (prototype); use Data &amp; Audit for JSON backup.</p>')}
function shift(n){DD=addD(DD,n);editMode=null;rDaily()}
function rDaily(){mn(`<h2>Daily KMR/HMR Entry</h2><div class="bar"><button onclick="shift(-1)">◀ Previous Day</button><input type="date" id="dd" value="${DD}" onchange="DD=this.value||DD;editMode=null;fillD()"><button onclick="DD=today();editMode=null;rDaily()">Today</button><button onclick="shift(1)">Next Day ▶</button>
<select id="dflt" onchange="F.daily=this.value;fillD()">${['All','Pending','Draft','Completed'].map(o=>`<option ${F.daily==o?'selected':''}>${o}</option>`).join('')}</select><input id="dq" placeholder="Search equipment" oninput="fillD()"><span class="sp"></span>
<button onclick="persist(false)">Save Draft</button><button class="p" onclick="persist(true)">Save / Submit</button><button onclick="editEntry()">Edit Entry</button></div><div id="dmsg"></div>
<div class="tw"><table><thead><tr><th>#</th><th>Registration No.</th><th>Type</th><th class="n">Opening KMR</th><th class="n">Closing KMR</th><th class="n">Daily KMR</th><th class="n">Opening HMR</th><th class="n">Closing HMR</th><th class="n">Daily HMR</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="dbody"></tbody></table></div>`);fillD()}
function stOf(id){const x=E(id,DD);return x?x.st:'Pending'}
function fillD(){const fl=F.daily||'All',q=($('#dq')||{value:''}).value.toLowerCase(),ed=editMode===DD;let h='',n=0,miss=0;
act().forEach(e=>{const x=E(e.id,DD),s=stOf(e.id);if(fl=='Completed'?!/Submitted|Corrected/.test(s):fl!='All'&&s!=fl)return;if(q&&!(e.reg+e.id+e.name+e.type).toLowerCase().includes(q))return;
const lock=x&&x.st!=='Draft'&&!ed,r=rowCalc(e,DD,x);n++;if(r.gk||r.gh)miss++;
const op=f=>{if(!e[f])return'<span class="mu">n/a</span>';if(r['o'+f]!=null&&!(x&&x['o'+f]!=null&&!prev(e.id,DD,f)))return f1(r['o'+f])+(r['g'+f]?`<br><span class="warn">⚠ no entry since ${r['g'+f]}</span>`:'');
return`<input class="num m${f}" placeholder="baseline" value="${x&&x['o'+f]!=null?x['o'+f]:''}" ${lock?'disabled':''} oninput="calc(this.closest('tr'))" title="First-ever reading: enter opening baseline">`};
const cl=f=>e[f]?`<input class="num c${f}" type="number" step="${f=='h'?'0.1':'1'}" value="${x&&x['c'+f]!=null?x['c'+f]:''}" ${lock?'disabled':''} oninput="calc(this.closest('tr'))">`:'<span class="mu">disabled</span>';
h+=`<tr data-eid="${e.id}"><td>${n}</td><td><b>${esc(e.reg||'—')}</b><br><span class="mu">${esc(e.id)}</span></td><td>${esc(e.type)}</td><td class="n">${op('k')}</td><td class="n">${cl('k')}</td><td class="n dk">—</td><td class="n">${op('h')}</td><td class="n">${cl('h')}</td><td class="n dh">—</td>
<td><span class="${cls(s)}">${s}</span>${r.gk||r.gh?'<br><span class="warn">Missing day(s)</span>':''}<br><label class="mu" style="font-size:11px"><input type="checkbox" class="rs" ${x&&x.rs?'checked':''} ${role()!='Admin'||lock?'disabled':''} onchange="calc(this.closest('tr'))"> Meter reset</label><div class="vm"></div></td>
<td><input class="rem" list="rl" value="${esc(x?x.rem:'')}" ${lock?'disabled':''} placeholder="Remark"></td></tr>`});
$('#dbody').innerHTML=h||'<tr><td colspan="11" class="mu">No equipment matches.</td></tr>';$$('#dbody tr[data-eid]').forEach(calc);
$('#dmsg').innerHTML=`<datalist id="rl">${['Breakdown','Idle','Under Maintenance','Meter Fault','Not Operated'].map(o=>`<option>${o}</option>`).join('')}</datalist><span class="mu">Only closing readings are editable; openings carry forward from the last saved closing.</span> ${miss?'<span class="warn">⚠ '+miss+' equipment have missing day(s) – last valid closing carried forward (never zero).</span>':''} ${ed?'<b class="warn">EDIT MODE – changes will be saved as “Corrected”.</b>':''}`}
function calc(tr){const eid=tr.dataset.eid,e=EQ(eid),rs=tr.querySelector('.rs').checked;let bad=false;
['k','h'].forEach(f=>{if(!e[f])return;const c=pf(tr.querySelector('.c'+f).value),o=opv(eid,DD,f,tr,rs),cell=tr.querySelector('.d'+f);cell.className='n d'+f;
if(c==null||o==null){cell.textContent='—';return}const v=rd(c-o);if(v<0){cell.textContent='Error';cell.classList.add('bad');bad=true}else cell.textContent=f1(v)});
tr.querySelector('.vm').textContent=bad?'Closing < opening. Correct it, or Admin: tick Meter reset.':'';tr.classList.toggle('er',bad)}
function editEntry(){if(!canEdit())return info('Not permitted','Operators cannot edit submitted entries. Switch role to Supervisor/Admin.');editMode=DD;toast('Edit mode on for '+DD);fillD()}
async function persist(sub){const d=DD,ed=editMode===d,errs=[],ops=[];let aff=0;
$$('#dbody tr[data-eid]').forEach(tr=>{const eid=tr.dataset.eid,e=EQ(eid),ex=E(eid,d);if(ex&&ex.st!=='Draft'&&!ed)return;const nm=e.reg||e.id;
const v={eid,date:d,ck:null,ch:null,ok:null,oh:null,rem:tr.querySelector('.rem').value.trim(),rs:tr.querySelector('.rs').checked};let any=!!v.rem,full=true;
['k','h'].forEach(f=>{if(!e[f])return;const c=pf(tr.querySelector('.c'+f).value),m=tr.querySelector('.m'+f);v['c'+f]=c;if(m)v['o'+f]=pf(m.value);if(c==null){full=false;return}any=true;
const o=opv(eid,d,f,tr,v.rs),U=f.toUpperCase()+'MR';if(o==null)errs.push(nm+': enter the opening '+U+' baseline');else if(c<o)errs.push(`${nm}: closing ${U} (${c}) is less than opening (${o})`);
const nx=nextE(eid,d,f);if(nx&&c>nx['c'+f]&&!nx.rs)errs.push(`${nm}: ${U} ${c} would make ${nx.date} negative – correct that day first`);if(ex&&ex['c'+f]!==c&&nx)aff++});
v.done=full||!!v.rem;if(!any&&!ex)return;if(ex&&ex.st!=='Draft'&&!v.done)errs.push(nm+': a submitted reading cannot be blanked');
if(ex&&['ck','ch','ok','oh','rem','rs'].every(k=>ex[k]===v[k])&&ex.st!=='Draft')return;ops.push({v,ex})});
if(errs.length)return info('Validation errors','<ul>'+errs.map(x=>'<li class="bad">'+esc(x)+'</li>').join('')+'</ul>');
if(!ops.length)return toast('Nothing new to save');
if(aff&&!(await ask(`You are changing a historical closing reading. Later records for ${aff} meter(s) depend on it; their opening readings and daily usage will be recalculated. Continue?`)))return;
let sv=0,dr=0;ops.forEach(({v,ex})=>{const{done,...rec}=v,old=ex&&ex.st!=='Draft';const st=(sub||ed)&&done?(old?'Corrected':'Submitted'):(old?ex.st:'Draft');
if(ex)Object.assign(ex,rec,{st});else DB.entries.push({...rec,st});st=='Draft'?dr++:sv++;aud(st+' entry',`${d} ${v.eid} KMR ${v.ck??'-'} HMR ${v.ch??'-'}${ex?' (was '+(ex.ck??'-')+'/'+(ex.ch??'-')+')':''}`)});
editMode=null;save();toast(`${sv} submitted/corrected, ${dr} draft`);fillD()}
function repData(a,b,ty,rg,st){const out=[];let d=a,n=0;while(d<=b&&n++<93){DB.eq.forEach(e=>{const x=E(e.id,d);if(!x&&!e.act)return;if(ty&&e.type!==ty)return;if(rg&&e.id!==rg)return;const s=x?x.st:'Pending';
if(st&&(st=='Completed'?!/Submitted|Corrected/.test(s):s!==st))return;out.push({d,e,s,rem:x?x.rem:'',...rowCalc(e,d,x)})});d=addD(d,1)}return out}
function rRep(){F.rf=F.rf||addD(today(),-6);F.rt=F.rt||today();const T=[...new Set(DB.eq.map(e=>e.type))];
mn(`<h2>KMR/HMR Reports</h2><div class="bar noprint"><label>From <input type="date" id="rf" value="${F.rf}" onchange="F.rf=this.value;fillR()"></label><label>To <input type="date" id="rt" value="${F.rt}" onchange="F.rt=this.value;fillR()"></label>
